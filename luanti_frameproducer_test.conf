# Luanti FrameProducer P2P Test Configuration
# This configuration enables network tracking mode using FrameProducer
# for bidirectional P2P communication via NetworkServer

# Tracking Export Settings
enable_tracking_export = true
tracking_mode = network

# Network Mode Settings (P2P via NetworkServer)
tracking_server_host = 127.0.0.1
tracking_tcp_port = 7001
tracking_client_id = luanti_producer

# Headless Rendering Settings
force_rendering = true
disable_singleplayer_autopause = true

# Display/Graphics Settings for Headless Mode
# Using null video driver like test_multiplayer.sh to avoid SDL event loop blocking
video_driver = null
enable_sound = false
enable_clouds = false
enable_3d_clouds = false

# Server/World Settings for Testing
name = FrameProducerTest
server_announce = false
enable_damage = false
menu_last_game = minetest
creative_mode = true
