# Luanti Configuration - Dataset Generation Mode
# Generates HD video + per-pixel semantic segmentation masks
# See docs/DATASET_GENERATION.md for full documentation
#
# Usage:
#   ./bin/luanti --config luanti_dataset.conf --gameid minetest \
#     --world worlds/my_dataset --go --name test

# === Dataset Generation ===
dataset_mode = true
dataset_output_dir = ./dataset_output
dataset_max_frames = 900           # 30 seconds at ~30fps (0 = unlimited)
dataset_frame_skip = 1             # dump every Nth frame
dataset_semantic_grid_size = 128   # semantic mask resolution (128x128)
dataset_walk_speed = 1.0           # procedural agent walk speed (0.1-1.0)

# === Frame Capture (required) ===
enable_tracking_export = true
tracking_mode = local
tracking_shm_name = tracking_viewport

# === Video Resolution ===
screen_w = 1280
screen_h = 720

# === Game Settings ===
server_announce = false
enable_damage = false
creative_mode = true
autojump = true

# === Headless / Automated ===
disable_singleplayer_autopause = true

# === Lighting ===
world_start_time = 12000           # noon (0=midnight, 6000=dawn, 12000=noon, 18000=dusk)
time_speed = 0                     # freeze time at noon for consistent lighting

# === World Generation ===
mg_name = v7
viewing_range = 300
name = test
